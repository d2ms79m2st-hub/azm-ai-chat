
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172019">
  <meta name="description" content="المساعد الرسمي لبدر أبا الخيل للعود والعطور. اكتشف العطور والهدايا واحصل على المساعدة في اختيار عطرك.">
  <title>بدر أبا الخيل | مساعد العطور</title>
  <style>
    :root {
      --bg:#101510;
      --panel:#171d17;
      --panel2:#202820;
      --border:#343d30;
      --text:#f5f1e6;
      --muted:#b0b5a6;
      --green:#89966a;
      --green-light:#a9b68a;
      --gold:#c6a76b;
      --danger:#ffb4a9;
    }

    * { box-sizing:border-box }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
      min-height:100dvh;
    }

    button,textarea { font:inherit }
    button { cursor:pointer }
    button:focus-visible,textarea:focus-visible,a:focus-visible {
      outline:2px solid var(--gold);
      outline-offset:3px;
    }

    a { color:inherit }

    .app {
      width:100%;
      max-width:1000px;
      height:100dvh;
      min-height:520px;
      margin:auto;
      display:flex;
      flex-direction:column;
      background:
        radial-gradient(ellipse at 50% 0%,rgba(137,150,106,.07),transparent 55%),
        var(--bg);
    }

    header {
      min-height:78px;
      padding:12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--border);
      background:rgba(16,21,16,.96);
    }

    .brand { display:flex;align-items:center;gap:12px;min-width:0 }

    .logo {
      width:47px;height:47px;flex-shrink:0;
      display:grid;place-items:center;
      border:1px solid var(--gold);
      border-radius:50%;
      color:var(--gold);
      font-size:26px;font-weight:800;
      background:#1c261c;
    }

    .brand-name { font-size:19px;font-weight:800;line-height:1.5 }
    .subtitle { font-size:11px;color:var(--muted);margin-top:2px }

    .new-chat {
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 13px;
      background:var(--panel);
      color:var(--text);
      white-space:nowrap;
    }
    .new-chat:hover { border-color:var(--gold) }

    .shop-link {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      margin-top:8px;
      text-decoration:none;
      color:var(--gold);
      font-size:12px;
    }

    main {
      flex:1;min-height:0;
      display:flex;flex-direction:column;
      padding:0 20px;
    }

    #messages {
      flex:1;min-height:0;overflow-y:auto;
      display:flex;flex-direction:column;gap:16px;
      padding:24px 0;
      scroll-behavior:smooth;
    }

    .welcome {
      width:100%;max-width:650px;
      margin:auto;padding:25px 0;
      text-align:center;
    }

    .welcome-mark {
      width:75px;height:75px;
      margin:0 auto 20px;
      display:grid;place-items:center;
      border:1px solid rgba(198,167,107,.65);
      border-radius:24px;
      color:var(--gold);
      font-size:36px;
      background:linear-gradient(145deg,#222d21,#151b15);
      box-shadow:0 12px 40px #0003;
    }

    .eyebrow {
      color:var(--gold);
      font-size:12px;
      letter-spacing:.4px;
      margin-bottom:10px;
    }

    h1 { margin:0 0 13px;font-size:clamp(26px,5vw,36px);line-height:1.5 }
    .welcome p {
      color:var(--muted);
      line-height:2;
      margin:0;
      font-size:14px;
    }

    .suggestions {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:11px;
      margin-top:28px;
      text-align:right;
    }

    .suggestion {
      padding:15px;
      min-height:91px;
      border:1px solid var(--border);
      background:linear-gradient(145deg,#1b231a,#161b16);
      color:var(--text);
      border-radius:15px;
      text-align:right;
      line-height:1.8;
      transition:border-color .15s,transform .15s;
    }

    .suggestion:hover {
      border-color:var(--gold);
      transform:translateY(-1px);
    }

    .suggestion strong { display:block;font-size:14px }
    .suggestion span { display:block;color:var(--muted);font-size:12px }

    .message {
      max-width:min(88%,720px);
      padding:13px 16px;
      border-radius:16px;
      line-height:2;
      font-size:15px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .user {
      align-self:flex-start;
      background:#89966a;
      color:#101510;
      border-bottom-left-radius:5px;
    }

    .assistant {
      align-self:flex-end;
      background:var(--panel2);
      border:1px solid var(--border);
      border-bottom-right-radius:5px;
    }

    .assistant.error { color:var(--danger) }

    .composer {
      padding:12px 0 max(15px,env(safe-area-inset-bottom));
      background:var(--bg);
    }

    .input-box {
      display:flex;align-items:flex-end;gap:10px;
      padding:9px;
      border:1px solid #454c3c;
      border-radius:19px;
      background:var(--panel);
    }

    .input-box:focus-within { border-color:var(--gold) }

    textarea {
      display:block;flex:1;min-width:0;
      min-height:43px;max-height:160px;resize:none;
      padding:11px 9px;border:0;outline:0;
      background:transparent;color:var(--text);
      line-height:1.7;
    }

    textarea::placeholder { color:#9da392 }

    .send {
      width:44px;height:44px;flex-shrink:0;
      border:1px solid #bba16c;
      border-radius:14px;
      background:var(--gold);
      color:#182018;
      font-size:24px;font-weight:800;
    }

    .send:disabled { opacity:.5;cursor:wait }

    .footer-note {
      text-align:center;color:#939989;
      font-size:11px;padding-top:10px;line-height:1.8;
    }

    .footer-note a { color:var(--gold);text-decoration:none }

    @media(max-width:520px) {
      header { min-height:70px;padding:10px 12px }
      main { padding:0 13px }
      #messages { padding:17px 0 }
      .brand-name { font-size:16px }
      .subtitle { font-size:10px }
      .logo { width:41px;height:41px;font-size:23px }
      .new-chat { padding:9px;font-size:11px }
      .suggestions { grid-template-columns:1fr;gap:8px;margin-top:22px }
      .suggestion { min-height:auto;padding:11px 13px }
      .message { max-width:95%;font-size:14px }
      .welcome { padding:15px 0 }
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">ب</div>
      <div>
        <div class="brand-name">بدر أبا الخيل</div>
        <div class="subtitle">للود والعطور · المساعد الرسمي</div>
        <a class="shop-link"
           href="https://baderabalkhail.com/"
           target="_blank" rel="noopener noreferrer">
          تسوّق من المتجر <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>
    <button class="new-chat" id="newChat" type="button">＋ محادثة جديدة</button>
  </header>

  <main>
    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-mark" aria-hidden="true">✳</div>
        <div class="eyebrow">عزّنا بطيبنا</div>
        <h1>حيّاك الله في عالم العطور</h1>
        <p>
          أنا مساعد بدر أبا الخيل، حاضر أساعدك تختار عطرك.
          <br>
          علّمني وش تحب من الروائح وميزانيتك، ونبدأ.
        </p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="ساعدني أختار عطر يناسب ذوقي، واسألني عن الروائح اللي أحبها وميزانيتي.">
            <strong>✧ اختر عطرك</strong>
            <span>نساعدك تكتشف الرائحة المناسبة</span>
          </button>

          <button class="suggestion" data-prompt="أبي أعرف العطور والمنتجات المتوفرة في متجر بدر أبا الخيل وأسعارها.">
            <strong>◈ المنتجات والأسعار</strong>
            <span>استفسر عن المنتجات المتاحة</span>
          </button>

          <button class="suggestion" data-prompt="اقترح لي هدية عطرية مميزة، واسألني عن المناسبة والميزانية.">
            <strong>🎁 هدية لها معنى</strong>
            <span>خيارات للهدايا والمناسبات</span>
          </button>

          <button class="suggestion" data-prompt="أبي أعرف سياسة الشحن والتوصيل في متجر بدر أبا الخيل.">
            <strong>⌁ الشحن والتوصيل</strong>
            <span>معلومات عن توصيل الطلبات</span>
          </button>
        </div>
      </div>
    </section>

    <div class="composer">
      <div class="input-box">
        <textarea id="prompt" rows="1" maxlength="4000"
          placeholder="اسألنا عن العطور أو اكتب طلبك..."
          aria-label="رسالتك"></textarea>
        <button class="send" id="send" type="button"
          aria-label="إرسال الرسالة">↑</button>
      </div>
      <div class="footer-note">
        بدر أبا الخيل للعود والعطور
        · <a href="https://baderabalkhail.com/" target="_blank" rel="noopener noreferrer">المتجر الرسمي</a>
        <br>
        قد تتغير الأسعار والتوفر؛ يُرجى التأكد من صفحة المنتج.
      </div>
    </div>
  </main>
</div>

<script>
  // أبقينا عنوان خدمة n8n وطريقة الاتصال كما في النسخة السابقة.
  const API_URL = "https://aoozesa51.app.n8n.cloud/webhook/azm-ai-chat";

  const messages = document.getElementById("messages");
  const input = document.getElementById("prompt");
  const sendButton = document.getElementById("send");
  const newChatButton = document.getElementById("newChat");

  const HISTORY_KEY = "bader_abalkhail_assistant_history";
  let history = [];

  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    if (Array.isArray(saved)) {
      history = saved.filter(item =>
        item &&
        typeof item.text === "string" &&
        (item.role === "user" || item.role === "model" || item.role === "assistant")
      ).slice(-20);
    }
  } catch {
    history = [];
  }

  const welcomeHTML = document.getElementById("welcome").outerHTML;

  function saveHistory() {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-20)));
    } catch (error) {
      console.warn("تعذر حفظ سجل المحادثة", error);
    }
  }

  function addMessage(text, type) {
    const element = document.createElement("div");
    element.className = "message " + type;
    element.textContent = text;
    messages.appendChild(element);
    messages.scrollTop = messages.scrollHeight;
    return element;
  }

  function attachSuggestionEvents() {
    messages.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => sendMessage(button.dataset.prompt));
    });
  }

  function showWelcome() {
    messages.innerHTML = welcomeHTML;
    attachSuggestionEvents();
  }

  function renderHistory() {
    if (!history.length) {
      showWelcome();
      return;
    }

    messages.innerHTML = "";
    history.forEach(item => {
      addMessage(item.text, item.role === "user" ? "user" : "assistant");
    });
  }

  async function sendMessage(value) {
    const text = (typeof value === "string" ? value : input.value).trim();
    if (!text || sendButton.disabled) return;

    const currentHistory = history.slice(-10).map(item => ({
      role: item.role === "user" ? "user" : "model",
      text: item.text
    }));

    messages.querySelector(".welcome")?.remove();
    addMessage(text, "user");

    input.value = "";
    input.style.height = "43px";
    sendButton.disabled = true;
    input.disabled = true;

    const loading = addMessage("لحظات، نجهّز لك الإجابة...", "assistant");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: currentHistory
        })
      });

      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error("وصل رد غير مفهوم من الخادم.");
      }

      if (!response.ok) {
        throw new Error(data.error || "تعذر الاتصال بالخدمة.");
      }

      if (!data.answer || typeof data.answer !== "string") {
        throw new Error(data.error || "لم يصل رد من المساعد.");
      }

      loading.textContent = data.answer;

      history.push(
        { role: "user", text },
        { role: "model", text: data.answer }
      );

      history = history.slice(-20);
      saveHistory();

    } catch (error) {
      loading.classList.add("error");
      loading.textContent = error instanceof TypeError
        ? "تعذر الاتصال بالخدمة. تحقق من الإنترنت وإعدادات CORS ثم حاول مرة أخرى."
        : "ما قدرنا نجيب الإجابة: " + error.message;

      console.error("Bader Assistant error:", error);

    } finally {
      sendButton.disabled = false;
      input.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }
  }

  sendButton.addEventListener("click", () => sendMessage());

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "43px";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  newChatButton.addEventListener("click", () => {
    history = [];
    saveHistory();
    input.value = "";
    input.style.height = "43px";
    showWelcome();
    input.focus();
  });

  attachSuggestionEvents();
  renderHistory();
</script>
</body>
</html>
