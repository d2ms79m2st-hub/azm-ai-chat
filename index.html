<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>عزم AI | مساعدك العربي</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#101114;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif}
    button,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}
    header{height:65px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292a30}
    .brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px}
    .logo{width:38px;height:38px;border-radius:13px;background:#c7f36b;color:#151710;display:grid;place-items:center;font-size:22px;font-weight:900}
    .new{border:1px solid #36373e;background:#1b1c21;color:white;border-radius:11px;padding:9px 12px}
    main{flex:1;display:flex;flex-direction:column;padding:22px 18px 12px}
    #messages{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
    .welcome{text-align:center;margin:auto 0;padding:35px 0}
    .welcome .big{font-size:48px;color:#c7f36b}
    h1{font-size:30px;margin:12px 0 8px}
    .muted{color:#999ba5;line-height:1.8}
    .suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
    .suggestion{background:#191a1f;border:1px solid #303139;color:#e8e8eb;text-align:right;border-radius:14px;padding:14px}
    .suggestion:hover{border-color:#c7f36b}
    .message{max-width:88%;padding:13px 16px;border-radius:17px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-start;background:#c7f36b;color:#171912;border-bottom-left-radius:5px}
    .assistant{align-self:flex-end;background:#202127;border:1px solid #303139;border-bottom-right-radius:5px}
    .composer{position:sticky;bottom:0;background:#101114;padding:10px 0 14px}
    .inputbox{display:flex;gap:10px;align-items:flex-end;border:1px solid #383940;background:#1b1c21;border-radius:18px;padding:10px}
    textarea{flex:1;resize:none;max-height:150px;min-height:42px;background:transparent;color:white;border:0;outline:none;padding:10px;line-height:1.6}
    .send{width:43px;height:43px;border:0;border-radius:13px;background:#c7f36b;color:#151710;font-size:21px;font-weight:bold}
    .note{text-align:center;font-size:11px;color:#777984;margin-top:10px}
    @media(max-width:480px){main{padding:14px 13px 8px}.welcome h1{font-size:26px}.suggestions{grid-template-columns:1fr}.message{max-width:94%}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">ع</div><span>عزم <span style="color:#c7f36b">AI</span></span></div>
    <button class="new" id="newChat">＋ محادثة جديدة</button>
  </header>
  <main>
    <section id="messages">
      <div class="welcome" id="welcome">
        <div class="big">✳</div>
        <h1>حيّاك في عزم AI</h1>
        <div class="muted">مساعدك العربي، من الفكرة إلى الإنجاز.<br>وش ودّك نبدأ فيه اليوم؟</div>
        <div class="suggestions">
          <button class="suggestion">💡 <b>اقترح لي فكرة</b><br><span class="muted">لمشروع أقدر أبدأه</span></button>
          <button class="suggestion">✍️ <b>ساعدني أكتب</b><br><span class="muted">رسالة أو محتوى مميز</span></button>
          <button class="suggestion">📚 <b>اشرح لي موضوعًا</b><br><span class="muted">بأسلوب واضح وبسيط</span></button>
          <button class="suggestion">💻 <b>ساعدني بالبرمجة</b><br><span class="muted">افهم الكود وطوّره</span></button>
        </div>
      </div>
    </section>
    <div class="composer">
      <div class="inputbox">
        <textarea id="prompt" rows="1" placeholder="اكتب رسالتك لعزم AI..."></textarea>
        <button class="send" id="send" aria-label="إرسال">↑</button>
      </div>
      <div class="note">عزم AI · النسخة التجريبية — قد تكون الردود محدودة قبل ربط النموذج</div>
    </div>
  </main>
</div>
<script>
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');
const input=document.getElementById('prompt');
function addMessage(text,who){
  const div=document.createElement('div');
  div.className='message '+who;
  div.textContent=text;
  messages.appendChild(div);
  return div;
}
function sendMessage(text){
  text=(text||input.value).trim();
  if(!text)return;
  welcome?.remove();
  addMessage(text,'user');
  input.value='';
  input.style.height='42px';
  const reply=addMessage('واجهة عزم AI تعمل بنجاح! الخطوة القادمة هي ربط المساعد بنموذج ذكاء اصطناعي حتى يجيب عن أسئلتك.','assistant');
  messages.scrollTop=messages.scrollHeight;
  reply.scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.getElementById('send').addEventListener('click',()=>sendMessage());
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
input.addEventListener('input',()=>{
  input.style.height='42px';
  input.style.height=Math.min(input.scrollHeight,150)+'px';
});
document.querySelectorAll('.suggestion').forEach(btn=>{
  btn.addEventListener('click',()=>sendMessage(btn.innerText.replace(/\n/g,' — ')));
});
document.getElementById('newChat').addEventListener('click',()=>{
  messages.innerHTML='';
  messages.appendChild(welcome);
  input.value='';
  input.focus();
});
</script>
</body>
</html>
